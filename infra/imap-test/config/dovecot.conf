# Minimal Dovecot test instance — plain IMAP for local dev only
protocols = imap
listen = *
base_dir = /run/dovecot/
instance_name = dovecot-zerux-test
login_greeting = Zerux IMAP test server ready.

# Virtual users (passwd-file)
auth_mechanisms = plain login
disable_plaintext_auth = no
auth_username_format = %Lu

!include auth-passwdfile.conf.ext
!include mail.conf
!include 10-master.conf
!include 10-ssl.conf
!include 10-logging.conf
